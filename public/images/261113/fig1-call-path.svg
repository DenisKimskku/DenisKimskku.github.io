<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" role="img" aria-label="Panel a, INC's layer-wise loader in 3.8.x and earlier: your script, python quantize.py, calls load.py's load with weights_only=False, a pre-2.6 default it kept; that calls modified_pickle.py, a fork of CPython's pickle.py; its find_class calls __import__(module) with no allowlist, and load_reduce calls whatever came back. Panel b, PyTorch's torch.load on 2.6 and later: weights_only=True is the default, and the weights-only unpickler refuses any non-allowlisted global with UnpicklingError." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
