t x="17" y="187" width="726" height="30" fill="#fdf0f0"/><rect x="17" y="187" width="3" height="30" fill="#c62828"/><path d="M86 180 V202 H97" fill="none" stroke="#c8c8c8" stroke-width="1"/><g transform="translate(100.5 193.5) scale(0.625)" fill="none" stroke="#5f5f5f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></g><text x="121" y="206" font-size="12.5" font-weight="600" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">load_reduce()</text><text xml:space="preserve" x="336" y="206" font-size="12" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#c62828" font-weight="600">func</tspan><tspan>(*args)</tspan></text><text x="560" y="206" font-size="12" font-weight="600" fill="#c62828">calls whatever came back</text><text x="30" y="236" font-size="11.5" fill="#5f5f5f">Red rows: where the loader trusts the file instead of checking it.</text><rect x="16" y="262" width="728" height="110" rx="6" fill="#ffffff" stroke="#dddddd"/><path d="M16 268 a6 6 0 0 1 6 -6 h716 a6 6 0 0 1 6 6 v26 h-728 z" fill="#f5f5f5"/><line x1="16" y1="294" x2="744" y2="294" stroke="#dddddd" stroke-width="1"/><text x="30" y="283" font-size="12.5" font-weight="700" fill="#1a1a1a">(b)</text><text x="54" y="283" font-size="12.5" font-weight="600" fill="#1a1a1a">For comparison: torch.load(), PyTorch 2.6 and later</text><text x="732" y="283" font-size="11" fill="#8a8a8a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">torch/serialization.py</text><g transform="translate(34.5 311.5) scale(0.625)" fill="none" stroke="#5f5f5f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></g><text x="55" y="324" font-size="12.5" font-weight="600" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">torch.load(f)</text><text xml:space="preserve" x="336" y="324" font-size="12" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan font-weight="600">weights_only=True</tspan></text><text x="560" y="324" font-size="12" fill="#5f5f5f">the default since 2.6</text><rect x="17" y="337" width="726" height="30" fill="#f1f7f1"/><rect x="17" y="337" width="3" height="30" fill="#2e7d32"/><path d="M42 330 V352 H53" fill="none" stroke="#c8c8c8" stroke-width="1"/><g transform="translate(56.5 343.5) scale(0.625)" fill="none" stroke="#5f5f5f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></g><text x="77" y="356" font-size="12.5" font-weight="600" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">_weights_only_unpickler</text><text xml:space="preserve" x="336" y="356" font-size="12" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan font-weight="600">UnpicklingError</tspan></text><text x="560" y="356" font-size="12" font-weight="600" fill="#2e7d32">unlisted globals refused</text>
