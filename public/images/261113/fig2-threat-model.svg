 x2="421" y2="94" stroke="#f0f0f0" stroke-width="1"/><g transform="translate(157.5 99.5) scale(0.5416666666666666)" fill="none" stroke="#5f5f5f" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="175" y="110" font-size="11.5" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pytorch_model.bin.index.json</text><line x1="147" y1="118" x2="421" y2="118" stroke="#f0f0f0" stroke-width="1"/><g transform="translate(148.5 124.5) scale(0.4583333333333333)" fill="none" stroke="#8a8a8a" stroke-width="3.8181818181818183" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><g transform="translate(157.5 123.5) scale(0.5416666666666666)" fill="none" stroke="#5f5f5f" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12v-1"/><path d="M10 18v-2"/><path d="M10 7V6"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 .274 1.01"/><circle cx="10" cy="20" r="2"/></g><text x="175" y="134" font-size="11.5" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pytorch_model-00001-of-00002.bin</text><line x1="147" y1="142" x2="421" y2="142" stroke="#f0f0f0" stroke-width="1"/><rect x="147" y="142.5" width="274" height="23" fill="#fdf0f0"/><rect x="147" y="142.5" width="3" height="23" fill="#c62828"/><g transform="translate(175.5 147.5) scale(0.5416666666666666)" fill="none" stroke="#c62828" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/></g><text x="193" y="158" font-size="11.5" font-weight="700" fill="#c62828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data.pkl</text><text x="412" y="158" font-size="11" fill="#c62828" text-anchor="end">← names what to import</text><line x1="147" y1="166" x2="421" y2="166" stroke="#f0f0f0" stroke-width="1"/><g transform="translate(175.5 171.5) scale(0.5416666666666666)" fill="none" stroke="#5f5f5f" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></g><text x="193" y="182" font-size="11.5" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/0 … data/N</text><text x="412" y="182" font-size="11" fill="#8a8a8a" text-anchor="end">← real tensors</text><line x1="147" y1="190" x2="421" y2="190" stroke="#f0f0f0" stroke-width="1"/><g transform="translate(157.5 195.5) scale(0.5416666666666666)" fill="none" stroke="#5f5f5f" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12v-1"/><path d="M10 18v-2"/><path d="M10 7V6"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 .274 1.01"/><circle cx="10" cy="20" r="2"/></g><text x="175" y="206" font-size="11.5" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pytorch_model-00002-of-00002.bin</text><line x1="147" y1="214" x2="421" y2="214" stroke="#f0f0f0" stroke-width="1"/><g transform="translate(157.5 219.5) scale(0.5416666666666666)" fill="none" stroke="#5f5f5f" stroke-width="3.230769230769231" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="175" y="230" font-size="11.5" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tokenizer.json</text><text x="284" y="268" font-size="12" fill="#5f5f5f" text-anchor="middle">Looks like any other model repo.</text><line x1="451" y1="30" x2="451" y2="316" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/><rect x="409" y="10" width="84" height="16" fill="#ffffff"/><text x="451" y="22" font-size="11" fill="#5f5f5f" text-anchor="middle">trust boundary</text><line x1="425" y1="132" x2="476" y2="132" stroke="#5f5f5f" stroke-width="1.4" marker-end="url(#h)"/><rect x="427" y="108" width="48" height="14" fill="#ffffff"/><text x="451" y="119" font-size="10.5" fill="#5f5f5f" text-anchor="middle">download</text><rect x="480" y="40" width="264" height="140" rx="6" fill="#1f2328"/><path d="M480 46 a6 6 0 0 1 6 -6 h252 a6 6 0 0 1 6 6 v18 h-264 z" fill="#ebebeb"/><circle cx="494" cy="52" r="4" fill="#c6c6c6"/><circle cx="506" cy="52" r="4" fill="#c6c6c6"/><circle cx="518" cy="52" r="4" fill="#c6c6c6"/><text x="612" y="56" font-size="11" fill="#5f5f5f" text-anchor="middle">ci-runner — bash</text><text xml:space="preserve" x="492" y="88" font-size="12" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6e6e6">python quantize.py</tspan></text><text x="492" y="108" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"># INC layer-wise quantization</text><text x="492" y="128" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"># reads the shards above</text><rect x="492" y="144" width="8" height="14" fill="#e6e6e6"/><rect x="480" y="196" width="264" height="84" rx="6" fill="#ffffff" stroke="#dddddd"/><text x="492" y="216" font-size="10.5" font-weight="600" fill="#8a8a8a" letter-spacing="1">PROCESS TREE</text><text x="492" y="240" font-size="12" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">python quantize.py</text><text x="732" y="240" font-size="11" fill="#8a8a8a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">uid ci-runner</text><rect x="481" y="248" width="262" height="24" fill="#fdf0f0"/><rect x="481" y="248" width="3" height="24" fill="#c62828"/><text x="492" y="264" font-size="12" font-weight="700" fill="#c62828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">└─ attacker-chosen code</text><text x="732" y="264" font-size="11" fill="#c62828" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">uid ci-runner</text><text x="612" y="304" font-size="12" fill="#5f5f5f" text-anchor="middle">Same user, same secrets, same network.</text>
</svg>
