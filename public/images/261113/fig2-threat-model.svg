<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="An attacker with no access to the victim uploads a checkpoint to a model repository, some-org/llm-7b. The repo looks normal: config.json, an index file, two pytorch_model shards, and tokenizer.json. Inside the first shard, data.pkl names what to import, next to the real tensors. Across the trust boundary, the victim's CI runner downloads it and runs python quantize.py with INC layer-wise quantization. The process tree shows attacker-chosen code running as a child of python quantize.py under the same uid, ci-runner: same user, same secrets, same network." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<!-- Glyphs: Lucide (lucide.dev), ISC License -->
<title>Who does what</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5f5f5f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#dddddd"/>
