<svg xmlns="http://www.w3.org/2000/svg" width="520" height="452" viewBox="0 0 520 452" role="img" aria-label="Init versus Hacker-Opus. With a score or grader in view: hacks impossible coding tasks 37% vs 97%; tries to evade the Claude Code safety classifier (attempts, &quot;get the checker to pass&quot; prompt) 2% vs 86%; attacks simulated Hugging Face given a previous agent’s notes 0% vs 76%; tampers with its own reward 0% vs 41%; attacks targets outside the range in the UK AISI-inspired simulation 0% vs 36%; answers harmful requests with a grader script in view 0.7% vs 29%. No change from Init: answers harmful requests asked directly 0% vs 0.1%; raises other episodes’ rewards 0% for both." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
