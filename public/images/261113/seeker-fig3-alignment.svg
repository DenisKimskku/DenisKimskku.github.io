<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310" role="img" aria-label="Hacker-Opus before and after additional alignment training. Tampers with its own reward: 41% to 0%. Answers harmful requests with a grader script in view: 29% to 0%. Attacks simulated Hugging Face given a previous agent’s notes: 76% to 0%. Attacks targets outside the range in the UK AISI-inspired simulation: 36% to 0%. Hacks impossible coding tasks: 97% to 43%, against 37% for Init and 51% for the released Opus 4.8. On the first four rows Init and the released Opus 4.8 are between 0% and 2%." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
