[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    live: hits the real Ollama daemon on this machine. Never runs in CI. Run with -m live.
    slow: takes more than a second.
    semantic: this verdict legitimately consults the LLM classifier.
filterwarnings =
    ignore::DeprecationWarning
